<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Submitted | Meer International Travels</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f8fc;
            font-family: Arial, sans-serif;
        }

        .thank-you {
            width: 90%;
            max-width: 550px;
            background: #ffffff;
            padding: 45px 30px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #123c69;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }

        h1 {
            color: #123c69;
            margin-bottom: 12px;
        }

        p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 25px;
            background: #123c69;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn:hover {
            background: #0b2948;
        }
    </style>
</head>

<body>

    <div class="thank-you">

        <div class="icon">✓</div>

        <h1>Thank You!</h1>

        <p>
            Your flight request has been submitted successfully.
            Our travel team will review your request and contact you
            shortly with the available options.
        </p>

        <a href="index.html" class="btn">
            Back to Home
        </a>

    </div>

</body>
</html>
